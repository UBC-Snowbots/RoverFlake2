name: Run setup and colcon build for Dev

on: push

jobs:
  setup_and_build_check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Main Repo
        uses: actions/checkout@v4
        with:
          path: 'RoverFlake2'

      - name: Clone rovercli
        uses: actions/checkout@v4
        with:
          repository: 'UBC-Snowbots/rovercli'
          path: 'rovercli'
          ref: 'e1da77438c3937369058e1dc66e40b8d0a486103'

      - name: Github setup
        run: |
          echo "ROVERFLAKE_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Setup Everything
        run: |
          cd rovercli
          python3 main.py setup --distro jazzy --ros-version base --git-protocol https --cd-roverflake n
          source ~/.bashrc
          cd ../RoverFlake2
      - name: Debug info
        run: |
          colcon version-check
          cmake --version
      - name: Build
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          colcon build --packages-skip sweeppy --parallel-workers 4
          source install/setup.bash

