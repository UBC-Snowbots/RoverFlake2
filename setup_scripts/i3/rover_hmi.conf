# Pin each HMI wall window to a CBS monitor via its [instance] title prefix.
# Output names from `xrandr --listmonitors` on the CBS box (2026-08-03).
# Install (i3 >= 4.20): add to ~/.config/i3/config:
#   include /path/to/RoverFlake2/setup_scripts/i3/rover_hmi.conf
# Older i3: paste these lines directly. Reload i3 with $mod+Shift+r.
for_window [title="^Rover HMI \[left\]"]   move to output DP-2-8
for_window [title="^Rover HMI \[center\]"] move to output DP-1
for_window [title="^Rover HMI \[right\]"]  move to output DP-2-9
