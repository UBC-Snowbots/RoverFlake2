# Velocity/acceleration limits used by MoveIt for trajectory time-
# parameterization.  Per joint: min(motor cap in motor_config.h MotorConfig,
# driver clamp AxisConfig::max_running_speed 0.1 rev/s) x 2pi -> rad/s, so
# planned trajectories never outrun what moteus_driver will actually send.
# Scaling factors are 1.0 because these ARE the real limits — downscale per
# motion request if you want slower.
default_velocity_scaling_factor: 1.0
default_acceleration_scaling_factor: 1.0

joint_limits:
  shoulder_joint:          # A1: motor 0.15 rev/s, driver clamp 0.10; 1.0 rev/s^2
    has_velocity_limits: true
    max_velocity: 0.63
    has_acceleration_limits: true
    max_acceleration: 6.28
  link_1_joint:            # A2: 0.03 rev/s, 0.5 rev/s^2
    has_velocity_limits: true
    max_velocity: 0.19
    has_acceleration_limits: true
    max_acceleration: 3.14
  link1_link2:             # A3: 0.05 rev/s, 0.5 rev/s^2
    has_velocity_limits: true
    max_velocity: 0.31
    has_acceleration_limits: true
    max_acceleration: 3.14
  a4_rotation:             # A4: 0.10 rev/s, 0.5 rev/s^2
    has_velocity_limits: true
    max_velocity: 0.63
    has_acceleration_limits: true
    max_acceleration: 3.14
  a5_rotation:             # A5: motor 0.15 rev/s, driver clamp 0.10; 2.0 rev/s^2
    has_velocity_limits: true
    max_velocity: 0.63
    has_acceleration_limits: true
    max_acceleration: 12.57
  a6_rotation:             # A6: motor 0.15 rev/s, driver clamp 0.10; 2.0 rev/s^2
    has_velocity_limits: true
    max_velocity: 0.63
    has_acceleration_limits: true
    max_acceleration: 12.57
  finger_left_joint:           # bare ints crash move_group: params must be doubles
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: false
    max_acceleration: 0.0
  finger_right_joint:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: false
    max_acceleration: 0.0
