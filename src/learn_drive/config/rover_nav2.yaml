# Nav2 settings for our rover, Part 2: no map, obstacles seen by a lidar.
#
# - No map: every position is measured from where the rover started ("odom" frame).
# - Costmaps "roll": they're a window that moves along with the rover.
# - The lidar (/scan) marks rocks into both costmaps; the planner and driver steer around them.
# - Rover size and speed limits are Leo's for now. Swap in the mini rover's real numbers later.

# ---------------------------------------------------------------------------
# BT navigator: the "manager". Takes a goal, then runs the steps:
# plan a path -> follow it -> if stuck, try recoveries (clear, spin, wait, back up).
# ---------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    global_frame: odom                 # no map, so goals are measured from the start point
    robot_base_frame: base_footprint   # the rover's "center on the ground" frame
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names: ["compute_path_error_code", "follow_path_error_code"]

# ---------------------------------------------------------------------------
# Planner: draws the whole route from here to the goal, on the global costmap.
# ---------------------------------------------------------------------------
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3          # never looser than the goal checker
      use_astar: true
      allow_unknown: true     # no map = everything starts "unknown"; allow driving through it

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true    # a 50 x 50 m window centred on the rover, moving with it
      width: 50
      height: 50
      resolution: 0.1         # m per cell
      track_unknown_space: false
      update_frequency: 1.0
      publish_frequency: 1.0
      # Rover size as a circle that covers its corners (Leo is about 0.50 x 0.46 m, so 0.34 m).
      # A circle means the planner and the driver agree on what "fits", whichever way it faces.
      robot_radius: 0.34
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:                # turns lidar hits into "blocked" cells
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true              # a beam that hits something: mark that cell blocked
          clearing: true             # cells a beam passed through: mark them free again
          inf_is_valid: true         # "inf" = beam hit nothing = everything along it is clear
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0    # m: only trust hits closer than this
          raytrace_max_range: 10.0   # m: clear cells along beams up to this far
      inflation_layer:               # paints a "keep away" halo around every blocked cell
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.0        # m: halo size
        cost_scaling_factor: 2.0     # how fast the halo fades (smaller = rocks "push" routes further away)
      always_send_full_costmap: true

# ---------------------------------------------------------------------------
# Controller: the "driver". 20 times a second, turns the path into a /cmd_vel command.
# Regulated Pure Pursuit = steer toward a point ("carrot") a little way ahead on the path.
# ---------------------------------------------------------------------------
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odom
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:                 # "stuck" = moved less than 0.5 m in 10 s
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:                     # "arrived" = within 0.3 m; final direction doesn't matter
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 3.15       # more than half a turn = any direction counts
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5              # m/s cruising speed
      lookahead_dist: 0.8                  # m: how far ahead the carrot sits...
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.5
      lookahead_time: 1.5                  # ...grows with speed: carrot = speed x 1.5 s ahead
      use_velocity_scaled_lookahead_dist: true
      use_rotate_to_heading: true          # if the path starts behind it, turn on the spot first
      rotate_to_heading_min_angle: 0.785   # rad (45 deg): only when that far off
      rotate_to_heading_angular_vel: 1.0   # rad/s
      max_angular_accel: 2.0
      use_regulated_linear_velocity_scaling: true   # slow down in tight turns
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_cost_regulated_linear_velocity_scaling: true   # slow down when squeezing past obstacles
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 2.0   # must match the inflation layer's cost_scaling_factor
      min_approach_linear_velocity: 0.05   # slow down approaching the goal...
      approach_velocity_scaling_dist: 0.6  # ...over the last 0.6 m
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      allow_reversing: false
      transform_tolerance: 0.1

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true    # small 6 x 6 m window, detailed, for the driver
      width: 6
      height: 6
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      robot_radius: 0.34
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 3.0    # the local window is only 6 x 6 m
          raytrace_max_range: 3.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.0
        cost_scaling_factor: 2.0
      always_send_full_costmap: true

# ---------------------------------------------------------------------------
# Behaviors: the recovery moves the manager can call when stuck.
# ---------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
